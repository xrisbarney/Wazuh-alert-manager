# WAM lab MISP (docs/trial-features/PLAN.md step 9.2).
#
# Trimmed from the official MISP/misp-docker project's docker-compose.yml
# (https://github.com/MISP/misp-docker, master @ 2026-11-19, template.env
# CORE_TAG=v2.5.52). misp-docker publishes no GitHub releases; the images are
# tagged per MISP release on ghcr.io, and v2.5.52 is the newest tag of both
# ghcr.io/misp/misp-docker/misp-core and ghcr.io/misp/misp-docker/misp-nginx
# at the time of writing. Pinned here so a re-run brings up the same MISP.
#
# Services kept: misp-core (PHP-FPM), misp-nginx (TLS front, split out of the
# core image by misp-docker PR #430 - since v2.5.46 misp-core only speaks
# FastCGI on 9002, so nginx is required), db (MariaDB) and redis (valkey).
# Omitted on purpose:
#   - misp-modules: the enrichment/import/export module daemon. The plugin only
#     calls MISP's own REST API (/attributes/restSearch); modules add ~1 GB RSS
#     and dozens of Python deps the lab never exercises.
#   - mail (SMTP relay) and misp-guard (reverse-proxy filter): unused here.
#
# Ports: host 8445 -> nginx 8443 (https). 8443 is the 4.14 Wazuh dashboard and
# 8444 the 5.0 dashboard, so MISP takes the next one; BASE_URL in .env matches.
# Memory: mem_limit per service keeps the whole lab under ~2.5 GB (redis 128M,
# db 768M, misp-core 1536M, nginx 128M).
#
# Data lives in named volumes (`docker compose down -v` removes everything) plus
# the bind-mounted ./data/ssl (self-signed certificate, generated by
# bootstrap.sh, gitignored). Named volumes rather than bind mounts for
# configs/files/logs because misp-core copies thousands of small files
# (taxonomies, galaxies, warninglists) into them on first start, which is
# painfully slow over a Windows bind mount.
#
# Credentials come from ./.env (gitignored; bootstrap.sh creates it from
# .env.example with a random admin password and key). Never commit .env.

services:
  redis:
    image: ghcr.io/valkey-io/valkey:7.2
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:-redispassword}", "--save", ""]
    mem_limit: 128m
    environment:
      - "TZ=${TZ:-UTC}"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${REDIS_PASSWORD:-redispassword}\" ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    volumes:
      - cache_data:/data

  db:
    # MariaDB: ARM-capable and ships the collations MISP expects (upstream choice).
    image: ghcr.io/mariadb/mariadb:10.11
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - "MYSQL_USER=${MYSQL_USER:-misp}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD:-example}"
      - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-password}"
      - "MYSQL_DATABASE=${MYSQL_DATABASE:-misp}"
      - "TZ=${TZ:-UTC}"
    # Upstream defaults are sized for a production host (2 GB buffer pool);
    # a 256 MB pool is plenty for one event and a handful of attributes.
    command: "\
      --innodb-buffer-pool-size=256M \
      --innodb-change-buffering=none \
      --innodb-io-capacity=1000 \
      --innodb-io-capacity-max=2000 \
      --innodb-log-file-size=128M \
      --innodb-read-io-threads=4 \
      --innodb-stats-persistent=ON \
      --innodb-write-io-threads=2"
    volumes:
      - mysql_data:/var/lib/mysql
    cap_add:
      - SYS_NICE # CAP_SYS_NICE prevents the runaway mysql log (upstream note)
    healthcheck:
      test: mysqladmin --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD status
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 30s

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:v2.5.52
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    # First start initialises the database and copies galaxies/taxonomies/
    # warninglists/objects into the named volumes before php-fpm listens:
    # measured 17 min on a Windows host under the 1.5 GB cap. The grace period
    # must cover that, or compose marks misp-core unhealthy at ~2.5 min and
    # `up -d` would fail on a dependency. After the grace period a failing streak
    # of 24 x 5 s (2 min) flips it to unhealthy.
    healthcheck:
      test: bash -c 'echo > /dev/tcp/127.0.0.1/9002' || exit 1
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 1500s
    expose:
      - 9002
    volumes:
      - misp_configs:/var/www/MISP/app/Config/
      - misp_logs:/var/www/MISP/app/tmp/logs/
      - misp_files:/var/www/MISP/app/files/
      - misp_gnupg:/var/www/MISP/.gnupg/
    cap_add:
      - AUDIT_WRITE
    environment:
      - "BASE_URL=${BASE_URL:?set BASE_URL in lab/misp/.env (bootstrap.sh creates it from .env.example)}"
      - "DISABLE_IPV6=true"
      - "ENABLE_DB_SETTINGS=false"
      - "ENABLE_BACKGROUND_UPDATES=false"
      - "DISABLE_CA_REFRESH=false"
      # Never let the entrypoint log the admin password / key in plain text.
      - "DISABLE_PRINTING_PLAINTEXT_CREDENTIALS=true"
      - "ADMIN_EMAIL=${ADMIN_EMAIL:-admin@admin.test}"
      - "MISP_CONTACT=${ADMIN_EMAIL:-admin@admin.test}"
      - "MISP_EMAIL=${ADMIN_EMAIL:-admin@admin.test}"
      - "ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in lab/misp/.env (bootstrap.sh generates it)}"
      - "ADMIN_KEY=${ADMIN_KEY:?set ADMIN_KEY in lab/misp/.env (bootstrap.sh generates it)}"
      - "ADMIN_ORG=${ADMIN_ORG:-WAM-LAB}"
      - "TZ=${TZ:-UTC}"
      # mysql / redis wiring (service names above)
      - "MYSQL_HOST=db"
      - "MYSQL_PORT=3306"
      - "MYSQL_USER=${MYSQL_USER:-misp}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD:-example}"
      - "MYSQL_DATABASE=${MYSQL_DATABASE:-misp}"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}"
      # php-fpm sizing for a one-user lab
      - "FASTCGI_LISTEN_STATUS=misp-core:9003"
      - "PHP_LISTEN_FPM=true"
      - "PHP_MEMORY_LIMIT=512M"
      - "PHP_MAX_EXECUTION_TIME=300"
      - "PHP_UPLOAD_MAX_FILESIZE=50M"
      - "PHP_POST_MAX_SIZE=50M"
      - "PHP_FCGI_CHILDREN=2"
      - "PHP_FCGI_START_SERVERS=1"
      - "PHP_FCGI_SPARE_SERVERS=1"
      - "PHP_FCGI_MAX_REQUESTS=0"
      - "PHP_SESSION_TIMEOUT=60"
      - "PHP_SESSION_COOKIE_TIMEOUT=10080"
      - "PHP_SESSION_DEFAULTS=php"
      - "PHP_SESSION_COOKIE_SAMESITE=Lax"

  misp-nginx:
    image: ghcr.io/misp/misp-docker/misp-nginx:v2.5.52
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      # service_started, not service_healthy: nginx only needs the name to
      # resolve and answers 502 until FastCGI is up, so a slow first-run
      # initialisation of misp-core (see its healthcheck) never aborts
      # `docker compose up -d`. bootstrap.sh waits for the login page itself.
      misp-core:
        condition: service_started
    ports:
      # host 8445 -> nginx https 8443. Bound on every interface on purpose: the
      # Wazuh dashboard container reaches it through `misp.internal` =
      # host-gateway, i.e. this published port.
      - "8445:8443"
    volumes:
      # cert.pem + key.pem generated by bootstrap.sh (SAN localhost, misp.internal).
      # With no files here nginx serves plain http only (upstream behaviour).
      - "./data/ssl:/etc/nginx/certs:ro"
    tmpfs:
      - /etc/nginx/conf.d:mode=0755,uid=101,gid=101
      - /var/cache/nginx:mode=0755,uid=101,gid=101
      - /tmp:mode=1777
    user: nginx
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - "TZ=${TZ:-UTC}"
      - "BASE_URL=${BASE_URL:?set BASE_URL in lab/misp/.env}"
      - "DISABLE_IPV6=true"
      - "NGINX_CLIENT_MAX_BODY_SIZE=50M"
      - "FASTCGI_LISTEN=misp-core:9002"
      - "FASTCGI_LISTEN_STATUS=misp-core:9003"
      - "FASTCGI_READ_TIMEOUT=300s"
      - "FASTCGI_SEND_TIMEOUT=300s"
      - "FASTCGI_CONNECT_TIMEOUT=300s"

volumes:
  mysql_data:
  cache_data:
  misp_configs:
  misp_logs:
  misp_files:
  misp_gnupg:
