name: Publish dashboard images

# Builds one wazuh/wazuh-dashboard image per supported Wazuh release with the
# matching Wazuh Alert Manager plugin zip preinstalled, and pushes them to
# GitHub Container Registry. It never builds the plugin itself: it consumes the
# zips attached to an existing GitHub release.
#
#   ghcr.io/<owner>/wazuh-dashboard-alert-manager:<wazuh version>
#   ghcr.io/<owner>/wazuh-dashboard-alert-manager:<wazuh version>-wam<plugin version>
#
# Runs when a release is published, or on demand for a chosen release tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      plugin_version:
        description: "Plugin release to package, without the leading v (defaults to the latest release)"
        required: false
        default: ""
      only_wazuh_version:
        description: "Build a single Wazuh version instead of the whole matrix (optional)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wazuh-dashboard-alert-manager

jobs:
  plan:
    name: Resolve release and matrix
    # The floating `:<wazuh version>` tag tracks the latest STABLE release, so a
    # GitHub pre-release (v3.0.0-rc.1) must never republish these images; build
    # one on demand with workflow_dispatch if a pre-release image is wanted.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.resolve.outputs.plugin_version }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve plugin version and build matrix
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PLUGIN_VERSION: ${{ github.event.inputs.plugin_version }}
          INPUT_ONLY: ${{ github.event.inputs.only_wazuh_version }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_TAG" ]; then
            version="${EVENT_TAG#v}"
          elif [ -n "$INPUT_PLUGIN_VERSION" ]; then
            version="${INPUT_PLUGIN_VERSION#v}"
          else
            version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' | sed 's/^v//')"
          fi
          echo "Packaging plugin release v$version"
          # Only non-prerelease rows of the matrix are published as images.
          matrix="$(jq -c --arg only "$INPUT_ONLY" '
            [ .[] | select(.prerelease != true)
                  | select($only == "" or .wazuhVersion == $only)
                  | {wazuh: .wazuhVersion, osd: .osdVersion} ]' supported-wazuh-versions.json)"
          echo "matrix=$matrix"
          echo "plugin_version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.wazuh }} (OSD ${{ matrix.target.osd }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WAZUH_VERSION=${{ matrix.target.wazuh }}
            OSD_VERSION=${{ matrix.target.osd }}
            PLUGIN_VERSION=${{ needs.plan.outputs.plugin_version }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.target.wazuh }}
            ${{ env.IMAGE }}:${{ matrix.target.wazuh }}-wam${{ needs.plan.outputs.plugin_version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify the plugin is installed in the pushed image
        run: |
          docker run --rm --entrypoint /usr/share/wazuh-dashboard/bin/opensearch-dashboards-plugin \
            "${IMAGE}:${{ matrix.target.wazuh }}" list | tee plugins.txt
          grep -q '^wazuhAlertManager@' plugins.txt
